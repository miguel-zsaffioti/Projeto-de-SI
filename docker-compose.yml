services:
  db:
    image: postgres:16-alpine
    container_name: oto_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: oto
      POSTGRES_USER: oto_user
      POSTGRES_PASSWORD: oto_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oto_user -d oto"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: oto_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      # Prisma exige o prefixo "postgresql://"
      DATABASE_URL: postgresql://oto_user:oto_pass@db:5432/oto
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: oto_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  postgres_data:
